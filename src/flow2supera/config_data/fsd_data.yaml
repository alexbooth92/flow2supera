# ===============
# fsd_data.yaml
# ===============

LogLevel:        INFO
Flow2Supera:
    PropertyConfig:
        SimConfigKeyword:    'fsd'
        TileLayout: ''
        DetectorProperties: ''

    ElectronEnergyThreshold: 5
    DataType: ['data', '']
    HitsType: 'prompt' #Only prompt or final
    RequireExtTrig: True

BBoxAlgorithm: BBoxInteraction
BBoxConfig:
    LogLevel:   WARNING
    Seed:       -1

    BBoxSize:   [100.44,316.2,100.44]
    BBoxTop:    [50.22,158.1,50.22]
    BBoxBottom: [-50.22,-158.1,-50.22]
    #NOTE: The VoxelSize will vary by module for MR5
    VoxelSize:  [0.372,0.372,0.372]

LabelAlgorithm: LArTPCMLReco3D
LabelConfig:
    #
    # SuperaAtomic::Driver configuration
    #
    LogLevel: WARNING
    DeltaSize:    10
    ComptonSize:  10
    LEScatterSize: 5
    TouchDistance: 1
    StoreLEScatter:   True
    SemanticPriority: [1,0,2,3,4]
    EnergyDepositThreshold: 0.0
    RewriteInteractionID:  False
